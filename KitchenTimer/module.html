<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  [hidden] { display: none !important; }
  body { width: auto; font-family: Poppins, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: var(--content-color); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
    padding: var(--mt, 36px) var(--ms, 12px) var(--mb, 12px); }
  /* Am body, damit auch die Eingabemaske (außerhalb von #app) die Farben kennt */
  body { --soft: color-mix(in srgb, var(--content-color) 10%, transparent);
    --softer: color-mix(in srgb, var(--content-color) 6%, transparent); --dim: color-mix(in srgb, var(--content-color) 60%, transparent); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  svg { display: block; }

  #list { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scrollbar-width: none; }
  #list::-webkit-scrollbar { display: none; }
  #empty { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; color: var(--dim); text-align: center; }

  .card { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--softer); }
  .ring { position: relative; flex: 0 0 auto; width: 52px; height: 52px; }
  .ring svg { width: 100%; height: 100%; }
  .ring svg:first-child { transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; }
  .ring .track { stroke: var(--soft); }
  .ring .bell { position: absolute; inset: 27%; width: 46%; height: 46%; color: var(--accent-color); display: none; }
  .card.ringing .ring .bell { display: block; }
  .ring .bar { stroke: var(--accent-color); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  /* Die Restzeit wird nie abgeschnitten; der Name gibt nach */
  .info { flex: 1 1 auto; min-width: min-content; }
  .name { font-size: .85em; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 0; min-width: 100%; }
  .time { font-size: 1.7em; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; white-space: nowrap; }
  /* Jede Ziffer in gleich breiter Zelle (--dw misst das Skript): die Anzeige springt nicht, der Doppelpunkt steht fest */
  .time i { display: inline-block; width: var(--dw, .66em); text-align: center; font-style: normal; }
  .buttons { flex: 0 0 auto; display: flex; gap: 6px; }
  .btn { width: 38px; height: 38px; border-radius: 50%; background: var(--soft); display: flex; align-items: center; justify-content: center; }
  .btn svg { width: 18px; height: 18px; }
  .btn.text { width: auto; padding: 0 12px; border-radius: 19px; font-size: .85em; font-weight: 600; white-space: nowrap; }
  .btn:active, .chip:active { transform: scale(.94); }

  .card.paused .time, .card.paused .bar { opacity: .5; }
  .card.ringing { background: color-mix(in srgb, var(--accent-color) 22%, transparent); animation: ring 1s ease-in-out infinite; }
  .card.ringing .time { color: var(--accent-color); }
  .card.ringing .stop { background: var(--accent-color); color: var(--card-color, #fff); }
  .card.ringing .bar { animation: blink 1s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  @keyframes ring { 50% { background: color-mix(in srgb, var(--accent-color) 42%, transparent); } }

  /* Ein einzelner Timer mit genug Platz: großer Ring in der Mitte */
  /* --d (Ringdurchmesser) setzt layout() aus dem freien Platz */
  #list.solo { justify-content: center; --d: min(46vmin, 220px); }
  #list.solo .card { position: relative; flex-direction: column; background: none; gap: 14px; padding: 0; }
  #list.solo .ring { width: var(--d); height: var(--d); }
  #list.solo .ring circle { stroke-width: 2.4; }
  #list.solo .info { position: absolute; top: calc(var(--d) / 2); transform: translateY(-50%); max-width: calc(var(--d) * .8);
    display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  #list.solo .name { text-align: center; font-size: clamp(.85em, calc(var(--d) * .07), 1.5em); }
  #list.solo .time { font-size: calc(var(--d) * .19); }
  #list.solo .card.ringing { animation: none; }
  #list.solo .card.ringing .ring { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.05); } }

  #quick { flex: 0 0 auto; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 1px; }
  #quick::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; height: 34px; padding: 0 13px; border-radius: 17px; background: var(--soft); font-size: .9em; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
  .chip small { color: var(--dim); font-size: .85em; }
  .chip.add { padding: 0 10px; }
  .chip.add svg { width: 16px; height: 16px; }

  /* Kleine Kachel: nur der nächste Timer, Schnellstart nur ohne Timer */
  html.compact #list .card:not(:first-child) { display: none; }
  html.compact #list { justify-content: center; }
  html.compact.has-timers #quick { display: none; }
  html.compact .card { padding: 6px 8px; gap: 8px; }
  html.compact .ring { width: 40px; height: 40px; }
  html.compact .time { font-size: 1.35em; }
  html.compact .btn { height: 32px; }
  html.compact .btn:not(.text) { width: 32px; }
  html.narrow .extend { display: none; }
  html.narrow .btn.text { padding: 0 9px; }
  /* Sehr schmal: der Ring weicht, Restzeit und Knöpfe bleiben */
  html.tiny .ring { display: none; }
  html.narrow .card { gap: 8px; padding: 8px; }
  html.narrow .ring { width: 40px; height: 40px; }
  html.narrow .time { font-size: 1.35em; }
  html.compact .extend { display: none; }
  #more { display: none; font-size: .75em; color: var(--dim); text-align: right; }
  html.compact.has-more #more { display: block; }

  #sheet { position: fixed; inset: 0; background: color-mix(in srgb, #000 45%, transparent); display: flex; align-items: center; justify-content: center; padding: 12px; }
  #sheet[hidden] { display: none; }
  #sheet form { box-sizing: border-box; width: min(100%, 320px); max-height: 100%; overflow-y: auto; padding: 16px; border-radius: 16px; background: var(--card-color, #fff); display: flex; flex-direction: column; gap: 12px; }
  #sheet h2 { margin: 0; font-size: 1.05em; }
  #sheet .field { display: flex; flex-direction: column; gap: 5px; font-size: .8em; color: var(--dim); min-width: 0; }
  #sheet .row .field { flex: 1 1 120px; }
  /* Eigene Felder statt Browser-Elemente: keine Zahlenpfeile, kein Systemrahmen */
  #sheet input { -webkit-appearance: none; appearance: none; box-sizing: border-box; width: 100%; min-width: 0; height: 44px; margin: 0; padding: 0 12px; border: 0; border-radius: 12px; outline: none;
    font: inherit; font-size: 1.25em; color: var(--content-color); caret-color: var(--accent-color); background: var(--soft); user-select: text; -webkit-user-select: text; transition: box-shadow .15s; }
  #sheet input:focus, #sheet .stepper:focus-within { box-shadow: inset 0 0 0 2px var(--accent-color); }
  #sheet .stepper { display: flex; align-items: center; height: 44px; border-radius: 12px; background: var(--soft); color: var(--content-color); transition: box-shadow .15s; }
  #sheet .stepper input { flex: 1 1 0; padding: 0; background: none; text-align: center; font-size: 1.7em; font-weight: 600; font-variant-numeric: tabular-nums; }
  #sheet .stepper input:focus { box-shadow: none; }
  #sheet .stepper button { flex: none; width: 40px; height: 44px; border-radius: 12px; font-size: 1.7em; line-height: 1; touch-action: manipulation; }
  #sheet .stepper button:active { background: var(--soft); }
  #sheet .row { display: flex; flex-wrap: wrap; gap: 10px; }
  #sheet .actions { display: flex; gap: 10px; justify-content: flex-end; }
  #sheet .actions button { height: 38px; padding: 0 16px; border-radius: 19px; background: var(--soft); font-weight: 600; }
  #sheet .actions .primary { background: var(--accent-color); color: var(--card-color, #fff); }
  #hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); padding: 8px 14px; border-radius: 12px; background: var(--content-color); color: var(--card-color, #fff); font-size: .85em; white-space: nowrap; }
  #hint[hidden] { display: none; }
</style>

<div id="app">
  <div id="list"></div>
  <div id="empty"></div>
  <div id="more"></div>
  <div id="quick"></div>
</div>
<div id="sheet" hidden>
  <form id="form" autocomplete="off">
    <h2 id="sheetTitle"></h2>
    <label class="field"><span id="labelName"></span><input id="inName" type="text" maxlength="40" enterkeyhint="done"></label>
    <div class="row">
      <div class="field"><span id="labelMin"></span><div class="stepper"><button type="button" data-step="-1" data-for="inMin" aria-label="−">−</button><input id="inMin" type="text" inputmode="numeric" maxlength="4" value="5"><button type="button" data-step="1" data-for="inMin" aria-label="+">+</button></div></div>
      <div class="field"><span id="labelSec"></span><div class="stepper"><button type="button" data-step="-1" data-for="inSec" aria-label="−">−</button><input id="inSec" type="text" inputmode="numeric" maxlength="4" value="0"><button type="button" data-step="1" data-for="inSec" aria-label="+">+</button></div></div>
    </div>
    <div class="actions"><button type="button" id="cancel"></button><button type="submit" class="primary" id="go"></button></div>
  </form>
</div>
<div id="hint" hidden></div>

<script>
(() => {
  'use strict';
  const cfg = /*CONFIG*/null;
  const T = text => (cfg.texts && cfg.texts[text]) || text;
  const $ = id => document.getElementById(id);
  const root = document.documentElement;

  // Ränder gibt die Visu in der Adresse vor
  const query = new URLSearchParams(location.search);
  [['mt', 'margintop'], ['ms', 'marginside'], ['mb', 'marginbottom']].forEach(([name, key]) => {
    const value = parseInt(query.get(key), 10);
    if (value >= 0) $('app').style.setProperty('--' + name, value + 'px');
  });

  const ICONS = {
    pause: '<path d="M8 5v14M16 5v14"/>', play: '<path d="M7 5l12 7-12 7z"/>', stop: '<path d="M6 6l12 12M18 6L6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>', bell: '<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"/>',
  };
  const svg = name => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS[name] + '</svg>';
  const esc = text => String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const CIRCLE = 2 * Math.PI * 21;

  let timers = Array.isArray(cfg.timers) ? cfg.timers : [];
  // Uhr des Servers: die Endzeiten stammen von dort
  let offset = (cfg.now || Date.now()) - Date.now();
  const now = () => Date.now() + offset;
  const left = t => (t.state === 'paused' ? t.remaining : t.state === 'ringing' ? 0 : Math.max(0, (t.endsAt - now()) / 1000));
  const ringing = t => t.state === 'ringing' || (t.state === 'running' && left(t) <= 0);
  const clock = seconds => {
    const s = Math.ceil(seconds), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s % 60).padStart(2, '0');
  };
  const send = (ident, data) => requestAction(ident, JSON.stringify(data));

  // ── Liste ──
  function render() {
    // Klingelnde zuerst, dann nach Restzeit
    const sorted = timers.slice().sort((a, b) => (ringing(b) - ringing(a)) || (left(a) - left(b)));
    const list = $('list');
    list.innerHTML = sorted.map(t => '<div class="card" data-id="' + esc(t.id) + '">'
      + '<div class="ring"><svg viewBox="0 0 48 48"><circle class="track" cx="24" cy="24" r="21"/><circle class="bar" cx="24" cy="24" r="21" stroke-dasharray="' + CIRCLE + '"/></svg>' + svg('bell').replace('<svg', '<svg class="bell"') + '</div>'
      + '<div class="info"><div class="name">' + esc(t.name) + '</div><div class="time"></div></div>'
      + '<div class="buttons"></div></div>').join('');
    $('empty').textContent = T('No timer running');
    $('empty').hidden = timers.length > 0;
    list.hidden = timers.length === 0;
    $('more').textContent = timers.length > 1 ? '+' + (timers.length - 1) + ' ' + T('more') : '';
    root.classList.toggle('has-timers', timers.length > 0);
    root.classList.toggle('has-more', timers.length > 1);
    layout();
    tick(true);
  }

  // Knöpfe je Zustand: nur neu setzen, wenn der Zustand wechselt (sonst verschluckt der Neuaufbau einen Tipp)
  function buttons(card, state) {
    if (card.dataset.state === state) return;
    card.dataset.state = state;
    card.className = 'card ' + state;
    card.setAttribute('aria-label', state === 'ringing' ? T('Time is up') : '');
    card.querySelector('.buttons').innerHTML = state === 'ringing'
      ? '<button class="btn text extend" data-act="extend">+1 ' + esc(T('min')) + '</button><button class="btn text stop" data-act="stop">' + esc(T('Stop')) + '</button>'
      : '<button class="btn extend text" data-act="extend">+1</button>'
        + '<button class="btn" data-act="' + (state === 'paused' ? 'resume' : 'pause') + '" aria-label="' + esc(T(state === 'paused' ? 'Resume' : 'Pause')) + '">' + svg(state === 'paused' ? 'play' : 'pause') + '</button>'
        + '<button class="btn" data-act="stop" aria-label="' + esc(T('Stop')) + '">' + svg('stop') + '</button>';
  }

  function tick(force) {
    let anyRinging = false;
    timers.forEach(t => {
      const card = $('list').querySelector('[data-id="' + t.id + '"]');
      if (!card) return;
      const rings = ringing(t), rest = left(t);
      anyRinging = anyRinging || rings;
      buttons(card, rings ? 'ringing' : t.state);
      const text = clock(rings ? 0 : rest);
      const time = card.querySelector('.time');
      if (force || time.textContent !== text) time.innerHTML = text.replace(/\d/g, '<i>$&</i>');
      // Der Ring füllt sich mit der abgelaufenen Zeit: leer am Start, voll beim Ablauf
      card.querySelector('.bar').style.strokeDashoffset = String(CIRCLE * (rings ? 0 : Math.min(1, rest / Math.max(1, t.duration))));
    });
    alarm(anyRinging);
  }

  function layout() {
    const compact = innerHeight < 260;
    root.classList.toggle('compact', compact);
    root.classList.toggle('narrow', innerWidth < 340);
    root.classList.toggle('tiny', innerWidth < 230);
    const list = $('list'), solo = !compact && timers.length === 1 && innerHeight >= 300 && innerWidth >= 220;
    list.classList.toggle('solo', solo);
    // Einzelner Timer: der Ring füllt Breite und Höhe der Liste (52 px bleiben für die Knöpfe darunter)
    if (solo) list.style.setProperty('--d', Math.max(120, Math.min(list.clientWidth, list.clientHeight - 52, 520)) + 'px');
  }

  $('list').addEventListener('click', event => {
    const button = event.target.closest('button[data-act]');
    const card = event.target.closest('.card');
    if (!button || !card) return;
    const id = card.dataset.id, act = button.dataset.act;
    if (act === 'extend') send('Extend', { id, seconds: 60 });
    if (act === 'pause') send('Pause', { id });
    if (act === 'resume') send('Resume', { id });
    if (act === 'stop') {
      send('Stop', { id });
      // Sofort ausblenden, damit das Klingeln endet; der Stand des Moduls folgt
      timers = timers.filter(t => t.id !== id);
      render();
    }
  });

  // ── Schnellstart ──
  function start(name, seconds) {
    if (timers.length >= cfg.max) { hint(T('Maximum number of timers reached')); return; }
    send('Start', { name, seconds });
  }
  function quick() {
    const chips = (cfg.presets || []).map((p, i) => '<button class="chip" data-preset="' + i + '">' + esc(p.name) + ' <small>' + clock(p.seconds) + '</small></button>')
      .concat((cfg.quick || []).map(m => '<button class="chip" data-minutes="' + m + '">' + m + ' ' + esc(T('min')) + '</button>'));
    $('quick').innerHTML = '<button class="chip add" data-add="1" aria-label="' + esc(T('New timer')) + '">' + svg('plus') + '</button>' + chips.join('');
  }
  $('quick').addEventListener('click', event => {
    const chip = event.target.closest('.chip');
    if (!chip) return;
    if (chip.dataset.add) return openSheet();
    if (chip.dataset.preset) { const p = cfg.presets[Number(chip.dataset.preset)]; return start(p.name, p.seconds); }
    const minutes = Number(chip.dataset.minutes);
    start(minutes + ' ' + T('min'), minutes * 60);
  });

  // ── Eigener Timer ──
  function openSheet() {
    $('inName').value = '';
    $('sheet').hidden = false;
  }
  // Zahlenfelder: [Höchstwert, Schrittweite]; Sekunden laufen im Kreis
  const LIMITS = { inMin: [1440, 1], inSec: [59, 5] };
  const num = id => Math.min(LIMITS[id][0], Math.max(0, parseInt($(id).value, 10) || 0));
  function step(id, dir) {
    const [max, size] = LIMITS[id], wrap = id === 'inSec';
    let v = dir > 0 ? Math.floor(num(id) / size) * size + size : Math.ceil(num(id) / size) * size - size;
    if (v > max) v = wrap ? 0 : max;
    if (v < 0) v = wrap ? Math.floor(max / size) * size : 0;
    $(id).value = String(v);
  }
  let holdTimer = 0;
  const release = () => { clearTimeout(holdTimer); clearInterval(holdTimer); };
  Object.keys(LIMITS).forEach(id => {
    $(id).addEventListener('input', () => { $(id).value = $(id).value.replace(/\D/g, ''); });
    $(id).addEventListener('focus', () => $(id).select());
    $(id).addEventListener('blur', () => { $(id).value = String(num(id)); });
  });
  $('form').querySelectorAll('[data-step]').forEach(button => {
    const go = () => step(button.dataset.for, Number(button.dataset.step));
    // Gedrückt halten zählt weiter
    button.addEventListener('pointerdown', () => { release(); go(); holdTimer = setTimeout(() => { holdTimer = setInterval(go, 90); }, 400); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(type => button.addEventListener(type, release));
    button.addEventListener('click', event => { if (event.detail === 0) go(); });
  });
  $('cancel').onclick = () => { $('sheet').hidden = true; };
  $('sheet').addEventListener('click', event => { if (event.target === $('sheet')) $('sheet').hidden = true; });
  $('form').addEventListener('submit', event => {
    event.preventDefault();
    const seconds = num('inMin') * 60 + num('inSec');
    if (seconds < 1 || seconds > 86400) return;
    $('sheet').hidden = true;
    start($('inName').value.trim() || clock(seconds), seconds);
  });

  let hintTimer = 0;
  function hint(text) {
    $('hint').textContent = text;
    $('hint').hidden = false;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => { $('hint').hidden = true; }, 2500);
  }

  // ── Ton ──
  // Browser und Apps geben Ton erst nach einer Berührung frei: beim ersten Tipp anlegen und entsperren.
  let audio = null, beeper = 0;
  function unlock() {
    if (!cfg.sound) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { audio = null; }
  }
  document.addEventListener('pointerdown', unlock, { passive: true });
  function beep() {
    if (!audio || audio.state !== 'running' || document.hidden) return;
    [0, 0.22, 0.44].forEach(at => {
      const osc = audio.createOscillator(), gain = audio.createGain(), t0 = audio.currentTime + at;
      osc.type = 'sine';
      osc.frequency.value = 1320;
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.35, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
      osc.connect(gain).connect(audio.destination);
      osc.start(t0);
      osc.stop(t0 + 0.18);
    });
  }
  function alarm(on) {
    if (on && !beeper && cfg.sound) { beep(); beeper = setInterval(beep, 1400); }
    if (!on && beeper) { clearInterval(beeper); beeper = 0; }
  }

  // ── Nachrichten des Moduls ──
  function onMessage(data) {
    let msg = data;
    if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch (e) { return; } }
    if (!msg || typeof msg !== 'object') return;
    if (msg.type === 'reload') { location.reload(); return; }
    if (msg.type === 'timers' && Array.isArray(msg.timers)) {
      if (typeof msg.now === 'number') offset = msg.now - Date.now();
      timers = msg.timers;
      render();
    }
  }
  window.handleMessage = onMessage;

  [['sheetTitle', 'New timer'], ['labelName', 'Name'], ['labelMin', 'Minutes'], ['labelSec', 'Seconds'], ['cancel', 'Cancel'], ['go', 'Start']]
    .forEach(([id, text]) => { $(id).textContent = T(text); });
  window.addEventListener('resize', layout);
  // Breiteste Ziffer der tatsächlich geladenen Schrift messen (Poppins hat keine Tabellenziffern)
  function measureDigits() {
    const probe = document.createElement('span');
    probe.className = 'time';
    probe.style.cssText = 'position:absolute;visibility:hidden;font-size:100px';
    document.body.appendChild(probe);
    let max = 0;
    for (let d = 0; d < 10; d++) { probe.textContent = String(d); max = Math.max(max, probe.getBoundingClientRect().width); }
    probe.remove();
    if (max > 0) root.style.setProperty('--dw', (Math.ceil(max) / 100) + 'em');
  }
  measureDigits();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measureDigits);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(true); });
  quick();
  render();
  setInterval(tick, 250);
})();
</script>
